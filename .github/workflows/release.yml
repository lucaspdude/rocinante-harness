name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.1.2). Defaults to the latest tag."
        required: false
        type: string
  push:
    tags: ["v*"]

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: Build api
        run: |
          mkdir -p ../../dist
          for platform in linux:amd64 linux:arm64 darwin:amd64 darwin:arm64 windows:amd64; do
            os=$(echo "$platform" | cut -d: -f1)
            arch=$(echo "$platform" | cut -d: -f2)
            ext=""
            [ "$os" = "windows" ] && ext=".exe"
            out="../../dist/api-${os}-${arch}${ext}"
            GOOS=$os GOARCH=$arch \
              go build -trimpath -ldflags="-s -w" \
                -o "$out" ./cmd/api
          done
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: api-binaries
          path: dist/api-*

  harness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build harness
        run: bash scripts/build-harness.sh
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: harness-binaries
          path: apps/harness/bin/roc-harness-*

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build web standalone
        run: |
          pnpm build
          # Next 16 standalone output omits static assets by default.
          # Copy the public/ and .next/static/ directories into the
          # standalone output so the minimal server can serve them.
          cp -r apps/web/public apps/web/.next/standalone/apps/web/public 2>/dev/null || true
          cp -r apps/web/.next/static apps/web/.next/standalone/.next/static 2>/dev/null || true
      - name: Tar web
        run: |
          mkdir -p ../../dist
          tar -czf ../../dist/web.tar.gz -C .next/standalone .
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: web-bundle
          path: dist/web.tar.gz

  release:
    needs: [api, harness, web]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: api-binaries
          path: dist/
      - uses: actions/download-artifact@v4
        with:
          name: harness-binaries
          path: apps/harness/bin/
      - uses: actions/download-artifact@v4
        with:
          name: web-bundle
          path: dist/
      - name: Compute checksums
        working-directory: dist
        run: |
          sha256sum api-* > SHA256SUMS
      - name: Resolve tag
        id: tag
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            echo "value=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.value }}
          name: ${{ steps.tag.outputs.value }}
          generate_release_notes: true
          files: |
            dist/api-*
            dist/web.tar.gz
            dist/SHA256SUMS
            apps/harness/bin/roc-harness-*
          body: |
            Release ${{ steps.tag.outputs.value }}.
            See docs/deploy/ for installation.
