name: E2E

on:
  pull_request:
    branches: [main]
    paths:
      - "apps/web/**"
      - "apps/api/**"
      - ".github/workflows/e2e.yml"
      - "apps/web/e2e/**"
  workflow_dispatch:

jobs:
  e2e:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Install Go deps (api)
        working-directory: apps/api
        run: go mod download

      - name: Install (pnpm)
        run: pnpm install --frozen-lockfile

      - name: Build api
        working-directory: apps/api
        run: go build -o ../../bin/api ./cmd/api

      - name: Build web
        working-directory: apps/web
        run: pnpm build

      - name: Init api with passphrase
        run: |
          mkdir -p /tmp/rh-share
          echo "e2e-passphrase" | ROCINANTE_SHARE_DIR=/tmp/rh-share ./bin/api init

      - name: Start api
        run: |
          ROCINANTE_SHARE_DIR=/tmp/rh-share \
            ROCINANTE_PASSPHRASE=e2e-passphrase \
            ROCINANTE_BIND=127.0.0.1 \
            nohup ./bin/api --port 30179 > /tmp/api.log 2>&1 &

      - name: Start web
        working-directory: apps/web
        run: |
          PORT=30178 nohup node server.js > /tmp/web.log 2>&1 &

      - name: Wait for api + web
        run: |
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:30179/api/v1/healthz > /dev/null && \
              curl -sfI http://127.0.0.1:30178/ > /dev/null && break
            sleep 2
          done
          curl -sf http://127.0.0.1:30179/api/v1/healthz
          echo

      - name: Install Playwright browsers
        working-directory: apps/web
        run: pnpm exec playwright install --with-deps chromium

      - name: Run E2E
        working-directory: apps/web
        run: pnpm exec playwright test --config e2e/playwright.config.ts

      - name: Upload screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots-${{ matrix.os }}
          path: apps/web/e2e/screenshots/
